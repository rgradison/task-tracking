name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create project if missing
        run: |
          curl -u ${{ secrets.SONAR_TOKEN }}: \
            -X POST "https://sonarcloud.io/api/projects/create" \
            -d "organization=rgradison" \
            -d "project=rgradison_task-tracking" \
            -d "name=task-tracking" \
            || echo "Project already exists or no permission"

      - name: Build, test & Sonar analysis
        run: >
          ./mvnw -B clean verify sonar:sonar
          -Dsonar.projectKey=rgradison_task-tracking
          -Dsonar.organization=rgradison
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.branch.name=master
          -Dsonar.qualitygate.wait=true

      #- name: Quality Gate check
      #  uses: sonarsource/sonarqube-quality-gate-action@v1.1.0

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # Docker only after quality passes
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        if: github.ref == 'refs/heads/master'
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/task-tracking:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/task-tracking:latest \
            .

      - name: Push Docker Images
        if: github.ref == 'refs/heads/master'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/task-tracking:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/task-tracking:latest

      - name: Set up Kubeconfig
        if: github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Replace image tag
        if: github.ref == 'refs/heads/master'
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/deployment.yaml         
      
          
      - name: Deploy to Kubernetes
        if: github.ref == 'refs/heads/master'
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/task-tracking