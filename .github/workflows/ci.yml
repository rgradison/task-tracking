name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ONE Maven command only
      - name: Build & test
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      # Docker only on main branch
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        if: github.ref == 'refs/heads/master'
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/task-tracking:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/task-tracking:latest \
            .

      - name: Push Docker images
        if: github.ref == 'refs/heads/master'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/task-tracking:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/task-tracking:latest
