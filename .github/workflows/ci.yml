name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    container: maven:3.9.9-eclipse-temurin-17

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tasktracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tasktracker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Install Postgres Client
        run: apt-get update && apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..20}; do
            pg_isready -h postgres -p 5432 -U postgres && exit 0
            echo "Waiting for postgres..."
            sleep 2
          done
          exit 1

      - name: Build, test & Sonar analysis
        run: >
          ./mvnw -B clean verify sonar:sonar
          -Dsonar.projectKey=rgradison_task-tracking
          -Dsonar.organization=rgradison
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.branch.name=master
          -Dsonar.qualitygate.wait=true

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  docker:
    runs-on: ubuntu-latest
    needs: build           # wait for build job to succeed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/task-tracking:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/task-tracking:latest \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/task-tracking:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/task-tracking:latest

