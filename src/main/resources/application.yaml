server:
  port: 8099

spring:
  application:
    name: task-tracking
  profiles:
    active: dev
  cloud:
    config:
      import: optional:configserver:http://localhost:8888
      fail-fast: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, env, prometheus, refresh

logging:
  level:
    root: INFO