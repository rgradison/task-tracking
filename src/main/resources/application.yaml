server:
  port: 8099
spring:
  application:
    name: task-tracking

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    enable:
      jvm: true  # Ensure this is not set to false

logging:
  level:
    com:
      omnipotent:
        task_tracking: DEBUG

# Alternative
# logging.level.com.omnipotent.task_tracking.service.TaskService=DEBUG

