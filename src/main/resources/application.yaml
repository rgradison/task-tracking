server:
  port: 8099

spring:
  application:
    name: task-tracking
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, env, prometheus, refresh
  endpoint:
    refresh:
      enabled: true

logging:
  level:
    root: INFO