apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracking
  template:
    metadata:
      labels:
        app: task-tracking
    spec:
      containers:
        - name: task-tracking
          image: rgradison/task-tracking:latest
          ports:
            - containerPort: 8099

          # 🟡 Startup Probe (for Spring Boot slow startup)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8099
            failureThreshold: 30
            periodSeconds: 10

          # 🟢 Readiness Probe (controls traffic)
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8099
            initialDelaySeconds: 10
            periodSeconds: 5

          # 🔵 Liveness Probe (restart if stuck)
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8099
            initialDelaySeconds: 30
            periodSeconds: 10